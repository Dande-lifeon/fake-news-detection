[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fakenews"
version = "0.1.0"
description = "Fake news detection on the ISOT dataset (binary text classification)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3,<1.6",
  "pyarrow>=12",
  "pyyaml>=6",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "joblib>=1.3",
  "requests>=2.28",
]

[project.optional-dependencies]
kaggle = ["kagglehub>=0.3"]
neural = [
  "torch>=2.1",
  "transformers>=4.41",
]
dev = [
  "pytest>=7",
  "ruff>=0.4",
  "datasketch>=1.6",
]

[tool.setuptools.packages.find]
include = ["fakenews*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".cache", ".tmp", "data", "models", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["slow: tests that need torch or a GPU"]
testpaths = ["tests"]
